  <!-- Inward arrow, repeated at 120-degree intervals -->
  <g fill="var(--contrast)">
    <path d="M244 128 L256 136 L268 128 L268 171 L280 171 L256 211 L232 171 L244 171Z"/>
    <path d="M244 128 L256 136 L268 128 L268 171 L280 171 L256 211 L232 171 L244 171Z" transform="rotate(120 256 256)"/>
    <path d="M244 128 L256 136 L268 128 L268 171 L280 171 L256 211 L232 171 L244 171Z" transform="rotate(240 256 256)"/>
  </g>
</svg>
