<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="--disc:#0891B2;--contrast:#FFFFFF">
  <!-- Outer disc -->
  <circle cx="256" cy="256" r="205" fill="var(--disc)"/>
  <!-- Almond-shaped eye -->
  <path d="M51 256 A205 126 0 0 1 461 256 A205 126 0 0 1 51 256Z" fill="var(--contrast)"/>
  <!-- Inner iris ring -->
  <circle cx="256" cy="256" r="126" fill="var(--disc)"/>
